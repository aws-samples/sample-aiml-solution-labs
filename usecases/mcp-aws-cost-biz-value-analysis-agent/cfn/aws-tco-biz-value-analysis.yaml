AWSTemplateFormatVersion: '2010-09-09'
Description: AWS TCO and Business Value Analysis - Full Stack (KB + DynamoDB + CloudFront + API)

Parameters:
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Foundation model ID for embeddings

  EmbeddingDimension:
    Type: Number
    Default: 1024
    Description: Dimension of embedding vectors (1024 for Titan v2)

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID (created externally)
    Default: us-west-2_6AuG0cghr

  CognitoClientId:
    Type: String
    Description: Cognito App Client ID (created externally)
    Default: 7sueti9imhqmlrubqvj97lqvse

  CognitoDomain:
    Type: String
    Description: Cognito domain prefix
    Default: us-west-26aug0cghr

  AgentRuntimeName:
    Type: String
    Default: aws_tco_biz_value_analyst
    Description: Name of the AgentCore runtime

Resources:
  # ═══════════════════════════════════════════════════════════
  # S3 Bucket for Pricing Documents (Knowledge Base source)
  # ═══════════════════════════════════════════════════════════
  PricingDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::AccountId}-${AWS::Region}-aws-pricing-docs'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ═══════════════════════════════════════════════════════════
  # DynamoDB Table for Chat Sessions
  # ═══════════════════════════════════════════════════════════
  ChatSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tco-bva-chat-sessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: aws-tco-bva

  # ═══════════════════════════════════════════════════════════
  # IAM Role for Knowledge Base
  # ═══════════════════════════════════════════════════════════
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'BedrockKB-${AWS::StackName}-${AWS::Region}-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: KnowledgeBasePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt PricingDocsBucket.Arn
                  - !Sub '${PricingDocsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
              - Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource:
                  - !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'

  # Lambda Role for Index Wait Function
  IndexWaitLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AOSSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aoss:APIAccessAll
                Resource: !Sub 'arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'

  # ═══════════════════════════════════════════════════════════
  # OpenSearch Serverless (Vector Store)
  # ═══════════════════════════════════════════════════════════
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: pricing-kb-encryption
      Type: encryption
      Policy: |
        {
          "Rules": [{"ResourceType": "collection", "Resource": ["collection/pricing-kb-collection"]}],
          "AWSOwnedKey": true
        }

  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: pricing-kb-network
      Type: network
      Policy: |
        [{"Rules": [{"ResourceType": "collection", "Resource": ["collection/pricing-kb-collection"]}, {"ResourceType": "dashboard", "Resource": ["collection/pricing-kb-collection"]}], "AllowFromPublic": true}]

  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: pricing-kb-data-access
      Type: data
      Policy: !Sub |
        [{"Rules": [{"ResourceType": "collection", "Resource": ["collection/pricing-kb-collection"], "Permission": ["aoss:CreateCollectionItems", "aoss:DeleteCollectionItems", "aoss:UpdateCollectionItems", "aoss:DescribeCollectionItems"]}, {"ResourceType": "index", "Resource": ["index/pricing-kb-collection/*"], "Permission": ["aoss:CreateIndex", "aoss:DeleteIndex", "aoss:UpdateIndex", "aoss:DescribeIndex", "aoss:ReadDocument", "aoss:WriteDocument"]}], "Principal": ["arn:aws:iam::${AWS::AccountId}:root", "${KnowledgeBaseRole.Arn}", "${IndexWaitLambdaRole.Arn}"]}]

  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - OpenSearchEncryptionPolicy
      - OpenSearchNetworkPolicy
      - OpenSearchDataAccessPolicy
    Properties:
      Name: pricing-kb-collection
      Type: VECTORSEARCH
      Description: Vector store for AWS pricing knowledge base

  OpenSearchIndex:
    Type: AWS::OpenSearchServerless::Index
    Properties:
      CollectionEndpoint: !GetAtt OpenSearchCollection.CollectionEndpoint
      IndexName: pricing-docs-index
      Settings:
        Index:
          Knn: true
      Mappings:
        Properties:
          embedding:
            Type: knn_vector
            Dimension: !Ref EmbeddingDimension
            Method:
              Engine: faiss
              Name: hnsw
              SpaceType: l2
              Parameters:
                EfConstruction: 512
                M: 16
          text:
            Type: text
            Index: true
          metadata:
            Type: text
            Index: false

  # ═══════════════════════════════════════════════════════════
  # Lambda + Custom Resource to Wait for Index
  # ═══════════════════════════════════════════════════════════
  IndexWaitFunction:
    Type: AWS::Lambda::Function
    DependsOn: OpenSearchDataAccessPolicy
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt IndexWaitLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request
          import urllib.error
          import boto3
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest

          def send_response(event, context, status, data=None, reason=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': reason or f'See CloudWatch Log Stream: {context.log_stream_name}',
                  'PhysicalResourceId': event.get('PhysicalResourceId', context.log_stream_name),
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {}
              }).encode('utf-8')
              req = urllib.request.Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('Content-Type', '')
              req.add_header('Content-Length', len(body))
              urllib.request.urlopen(req)

          def handler(event, context):
              print(f"Event: {json.dumps(event)}")
              if event['RequestType'] == 'Delete':
                  send_response(event, context, 'SUCCESS')
                  return
              
              props = event['ResourceProperties']
              endpoint = props['CollectionEndpoint']
              index_name = props['IndexName']
              region = props['Region']
              
              host = endpoint.replace('https://', '')
              url = f"https://{host}/{index_name}"
              
              session = boto3.Session()
              credentials = session.get_credentials()
              
              max_attempts = 30
              for attempt in range(max_attempts):
                  try:
                      request = AWSRequest(method='GET', url=url)
                      SigV4Auth(credentials, 'aoss', region).add_auth(request)
                      
                      req = urllib.request.Request(url, method='GET')
                      for key, value in request.headers.items():
                          req.add_header(key, value)
                      
                      response = urllib.request.urlopen(req, timeout=30)
                      result = json.loads(response.read().decode('utf-8'))
                      print(f"Index {index_name} is ready: {result}")
                      send_response(event, context, 'SUCCESS', {'IndexReady': 'true'})
                      return
                  except urllib.error.HTTPError as e:
                      print(f"Attempt {attempt + 1}: HTTP {e.code} - {e.reason}")
                      if e.code == 404:
                          print("Index not found yet, waiting...")
                      elif e.code == 403:
                          print("Access denied - waiting for permissions to propagate...")
                      time.sleep(10)
                  except Exception as e:
                      print(f"Attempt {attempt + 1}: Error - {str(e)}")
                      time.sleep(10)
              
              send_response(event, context, 'FAILED', reason=f'Index {index_name} not ready after {max_attempts} attempts')

  WaitForIndex:
    Type: Custom::WaitForIndex
    DependsOn: OpenSearchIndex
    Properties:
      ServiceToken: !GetAtt IndexWaitFunction.Arn
      CollectionEndpoint: !GetAtt OpenSearchCollection.CollectionEndpoint
      IndexName: pricing-docs-index
      Region: !Ref AWS::Region

  # ═══════════════════════════════════════════════════════════
  # Bedrock Knowledge Base
  # ═══════════════════════════════════════════════════════════
  PricingKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: WaitForIndex
    Properties:
      Name: aws-pricing-knowledge-base
      Description: Knowledge Base for AWS pricing and TCO analysis
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
      StorageConfiguration:
        Type: OPENSEARCH_SERVERLESS
        OpensearchServerlessConfiguration:
          CollectionArn: !GetAtt OpenSearchCollection.Arn
          VectorIndexName: pricing-docs-index
          FieldMapping:
            VectorField: embedding
            TextField: text
            MetadataField: metadata

  PricingDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref PricingKnowledgeBase
      Name: aws-pricing-docs-source
      Description: S3 data source for AWS pricing documents
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt PricingDocsBucket.Arn
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: NONE

  # ═══════════════════════════════════════════════════════════
  # S3 Bucket for Frontend (React build)
  # ═══════════════════════════════════════════════════════════
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::AccountId}-${AWS::Region}-tco-bva-frontend'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ═══════════════════════════════════════════════════════════
  # CloudFront Origin Access Control
  # ═══════════════════════════════════════════════════════════
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ═══════════════════════════════════════════════════════════
  # Cognito Identity Pool (for browser AWS credentials)
  # ═══════════════════════════════════════════════════════════
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${AWS::StackName}-identity-pool'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoClientId
          ProviderName: !Sub 'cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}'

  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-cognito-auth-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: CognitoAuthPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource: !GetAtt ChatSessionsTable.Arn
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:ListAgentRuntimes
                  - bedrock-agentcore:GetAgentRuntime
                Resource: '*'

  # ═══════════════════════════════════════════════════════════
  # CloudFront Distribution
  # ═══════════════════════════════════════════════════════════
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: !Sub '${AWS::StackName} - TCO BVA Chatbot'
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        PriceClass: PriceClass_100
        HttpVersion: http2and3

Outputs:
  PricingDocsBucketName:
    Value: !Ref PricingDocsBucket
    Description: S3 bucket for pricing documents

  KnowledgeBaseId:
    Value: !Ref PricingKnowledgeBase
    Description: Bedrock Knowledge Base ID

  DataSourceId:
    Value: !GetAtt PricingDataSource.DataSourceId
    Description: Knowledge Base Data Source ID

  OpenSearchCollectionEndpoint:
    Value: !GetAtt OpenSearchCollection.CollectionEndpoint
    Description: OpenSearch Serverless collection endpoint

  ChatSessionsTableName:
    Value: !Ref ChatSessionsTable
    Description: DynamoDB table for chat sessions

  FrontendBucketName:
    Value: !Ref FrontendBucket
    Description: S3 bucket for frontend static files

  CloudFrontDomainName:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: CloudFront distribution domain name

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
    Description: CloudFront distribution ID

  CloudFrontURL:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Description: Full CloudFront URL for the application

  IdentityPoolId:
    Value: !Ref CognitoIdentityPool
    Description: Cognito Identity Pool ID for browser AWS credentials
