<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Arial, Helvetica, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687078"/></marker></defs>
<rect width="1200" height="540" fill="#FFFFFF"/>
<rect x="10" y="10" width="1180" height="200" rx="14" fill="#F7F9FB" stroke="#232F3E" stroke-width="1.5"/>
<text x="30" y="42" font-size="18" fill="#232F3E" text-anchor="start" font-weight="bold">AgentExpress Control Plane</text>
<text x="300.40000000000003" y="42" font-size="13" fill="#545B64" text-anchor="start">one per account · where you design workflows</text>
<rect x="30.0" y="66" width="213.6" height="84" rx="10" fill="#E6F2FF" stroke="#232F3E" stroke-width="1.5"/>
<text x="136.8" y="95.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Design</text>
<text x="136.8" y="112.0" text-anchor="middle" font-size="12.5" fill="#545B64">describe it to the</text>
<text x="136.8" y="129.0" text-anchor="middle" font-size="12.5" fill="#545B64">AgentExpress Assistant</text>
<rect x="261.6" y="66" width="213.6" height="84" rx="10" fill="#E6F2FF" stroke="#232F3E" stroke-width="1.5"/>
<text x="368.40000000000003" y="95.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Build</text>
<text x="368.40000000000003" y="112.0" text-anchor="middle" font-size="12.5" fill="#545B64">agents, stages, gates and</text>
<text x="368.40000000000003" y="129.0" text-anchor="middle" font-size="12.5" fill="#545B64">tools on the canvas</text>
<rect x="493.2" y="66" width="213.6" height="84" rx="10" fill="#E6F2FF" stroke="#232F3E" stroke-width="1.5"/>
<text x="600.0" y="95.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Library</text>
<text x="600.0" y="112.0" text-anchor="middle" font-size="12.5" fill="#545B64">reuse tools, guardrails,</text>
<text x="600.0" y="129.0" text-anchor="middle" font-size="12.5" fill="#545B64">policies and more</text>
<rect x="724.8" y="66" width="213.6" height="84" rx="10" fill="#E6F2FF" stroke="#232F3E" stroke-width="1.5"/>
<text x="831.5999999999999" y="95.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Share</text>
<text x="831.5999999999999" y="112.0" text-anchor="middle" font-size="12.5" fill="#545B64">work on workflows</text>
<text x="831.5999999999999" y="129.0" text-anchor="middle" font-size="12.5" fill="#545B64">with colleagues</text>
<rect x="956.4" y="66" width="213.6" height="84" rx="10" fill="#FFF4E0" stroke="#FF9900" stroke-width="1.5"/>
<text x="1063.2" y="95.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Version and deploy</text>
<text x="1063.2" y="112.0" text-anchor="middle" font-size="12.5" fill="#545B64">with AWS CDK</text>
<text x="1063.2" y="129.0" text-anchor="middle" font-size="12.5" fill="#545B64">or Terraform</text>
<text x="30" y="186" font-size="13" fill="#545B64" text-anchor="start">Every workflow is saved as one file, workflow.json. The Control Plane never runs a workflow itself.</text>
<line x1="1063.2" y1="150" x2="1063.2" y2="314" stroke="#687078" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1049.2" y="254" font-size="13" fill="#232F3E" text-anchor="end" font-weight="bold">Deploy: one Execution Plane per workflow,</text>
<text x="1049.2" y="272" font-size="13" fill="#232F3E" text-anchor="end">in its own stack (AWS CDK or Terraform)</text>
<line x1="130" y1="314" x2="130" y2="212" stroke="#687078" stroke-width="1.8" marker-end="url(#a)"/>
<text x="144" y="254" font-size="13" fill="#232F3E" text-anchor="start" font-weight="bold">Improve: change the workflow and deploy again</text>
<text x="144" y="272" font-size="13" fill="#232F3E" text-anchor="start">to ship version 2, 3, … to the same Execution Plane</text>
<rect x="26" y="314" width="1164" height="200" rx="14" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.2"/>
<rect x="18" y="322" width="1164" height="200" rx="14" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.2"/>
<rect x="10" y="330" width="1164" height="200" rx="14" fill="#F7F9FB" stroke="#232F3E" stroke-width="1.5"/>
<text x="30" y="362" font-size="18" fill="#232F3E" text-anchor="start" font-weight="bold">AgentExpress Execution Plane</text>
<text x="321.2" y="362" font-size="13" fill="#545B64" text-anchor="start">one per deployed workflow · where you run it</text>
<rect x="30.0" y="386" width="210.4" height="84" rx="10" fill="#E9F7EC" stroke="#232F3E" stroke-width="1.5"/>
<text x="135.2" y="415.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Run</text>
<text x="135.2" y="432.0" text-anchor="middle" font-size="12.5" fill="#545B64">send a request and</text>
<text x="135.2" y="449.0" text-anchor="middle" font-size="12.5" fill="#545B64">watch the agents work</text>
<rect x="258.4" y="386" width="210.4" height="84" rx="10" fill="#E9F7EC" stroke="#232F3E" stroke-width="1.5"/>
<text x="363.59999999999997" y="415.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Review</text>
<text x="363.59999999999997" y="432.0" text-anchor="middle" font-size="12.5" fill="#545B64">approve, revise or deny</text>
<text x="363.59999999999997" y="449.0" text-anchor="middle" font-size="12.5" fill="#545B64">at each gate</text>
<rect x="486.8" y="386" width="210.4" height="84" rx="10" fill="#E9F7EC" stroke="#232F3E" stroke-width="1.5"/>
<text x="592.0" y="415.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Re-run</text>
<text x="592.0" y="432.0" text-anchor="middle" font-size="12.5" fill="#545B64">re-run a step with</text>
<text x="592.0" y="449.0" text-anchor="middle" font-size="12.5" fill="#545B64">feedback, or stop a run</text>
<rect x="715.2" y="386" width="210.4" height="84" rx="10" fill="#E9F7EC" stroke="#232F3E" stroke-width="1.5"/>
<text x="820.4000000000001" y="415.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Observe</text>
<text x="820.4000000000001" y="432.0" text-anchor="middle" font-size="12.5" fill="#545B64">cost, prompts, tool calls</text>
<text x="820.4000000000001" y="449.0" text-anchor="middle" font-size="12.5" fill="#545B64">and quality scores</text>
<rect x="943.6" y="386" width="210.4" height="84" rx="10" fill="#E9F7EC" stroke="#232F3E" stroke-width="1.5"/>
<text x="1048.8" y="415.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Chat</text>
<text x="1048.8" y="432.0" text-anchor="middle" font-size="12.5" fill="#545B64">ask the Run Assistant</text>
<text x="1048.8" y="449.0" text-anchor="middle" font-size="12.5" fill="#545B64">about your runs</text>
<text x="30" y="506" font-size="13" fill="#545B64" text-anchor="start">Runs on Amazon Bedrock AgentCore: Runtime, Gateway, Memory, Identity, Policy, Guardrails, Observability and Evaluations.</text>
</svg>
