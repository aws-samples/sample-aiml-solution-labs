AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AgentExpress workshop - deploys the AgentExpress Builder console with AWS CDK from a
  CodeBuild project (ARM, Docker-in-Docker), creates two workshop users and exposes the
  console URL and their password as stack outputs. Sandbox / workshop accounts only.

Parameters:
  RepoUrl:
    Type: String
    Default: https://github.com/praven80/AgentExpress.git
    Description: Public Git repository that holds the AgentExpress framework. Used when no source zip is given.
  RepoBranch:
    Type: String
    Default: UI
    Description: Branch to deploy.
  AssetsBucketName:
    Type: String
    Default: ""
    Description: Optional. S3 bucket holding agentexpress-source.zip (Workshop Studio sets this to the event assets bucket).
  AssetsBucketPrefix:
    Type: String
    Default: ""
    Description: Optional. Key prefix of agentexpress-source.zip in AssetsBucketName, ending in a slash.
  DesignerModel:
    Type: String
    Default: ""
    Description: >-
      Optional. The AgentExpress Assistant's model (CDK -c designerModel). Empty uses the framework
      default, Claude Sonnet 5.5. Set e.g. us.anthropic.claude-sonnet-5 where Sonnet 5.5 is not allowed.
  ClaudeModels:
    Type: String
    Default: us.anthropic.claude-sonnet-5-5 us.anthropic.claude-haiku-4-5-20251001-v1:0 us.anthropic.claude-sonnet-5
    Description: >-
      Space-separated Claude inference profiles to enable in the account (first call accepts the
      Marketplace terms). Sonnet 5.5 is the AgentExpress Assistant's model; Haiku 4.5 is the agents' default.
  AgentName:
    Type: String
    Default: agentexpress
    AllowedPattern: "^[a-z][a-z0-9_]{2,30}$"
    Description: Console name. The CDK stack is <AgentName with dashes>-stack.

Conditions:
  HasSourceZip: !Not [!Equals [!Ref AssetsBucketName, ""]]
  HasSourcePrefix: !Not [!Equals [!Ref AssetsBucketPrefix, ""]]
  HasDesignerModel: !Not [!Equals [!Ref DesignerModel, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # CodeBuild project that runs `cdk deploy` (ACTION=deploy) or `cdk destroy`
  # (ACTION=destroy) for the console. AdministratorAccess is used because CDK
  # bootstrap and the console stack create IAM roles, ECR, AgentCore, Cognito,
  # CloudFront and more. Use this template in sandbox / workshop accounts only.
  # ---------------------------------------------------------------------------
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  ConsoleWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  DeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AgentName}-workshop-console"
      Description: Deploys (or destroys) the AgentExpress console with AWS CDK.
      ServiceRole: !GetAtt DeployRole.Arn
      TimeoutInMinutes: 90
      Artifacts: { Type: NO_ARTIFACTS }
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true # Docker is needed to build the linux/arm64 runtime image
        EnvironmentVariables:
          - { Name: REPO_URL, Value: !Ref RepoUrl }
          - { Name: REPO_BRANCH, Value: !Ref RepoBranch }
          - { Name: AGENT_NAME, Value: !Ref AgentName }
          - { Name: CLAUDE_MODELS, Value: !Ref ClaudeModels }
          - { Name: DESIGNER_MODEL, Value: !If [HasDesignerModel, !Ref DesignerModel, "none"] }
          - { Name: SOURCE_BUCKET, Value: !If [HasSourceZip, !Ref AssetsBucketName, "none"] }
          - { Name: SOURCE_PREFIX, Value: !If [HasSourcePrefix, !Ref AssetsBucketPrefix, "none"] }
          - { Name: ACTION, Value: deploy }
          - { Name: WAIT_URL, Value: !Ref ConsoleWaitHandle }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED }
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
          phases:
            install:
              runtime-versions:
                nodejs: 22
              commands:
                - node --version && docker --version && aws --version
            build:
              commands:
                - |
                  # Source: agentexpress-source.zip from the assets bucket when it is there (needed only for a
                  # private repo), otherwise a git clone of the public repository.
                  set -euo pipefail
                  PREFIX="$SOURCE_PREFIX"; [ "$PREFIX" = "none" ] && PREFIX=""
                  if [ "$SOURCE_BUCKET" != "none" ] && aws s3 cp "s3://$SOURCE_BUCKET/${PREFIX}agentexpress-source.zip" /tmp/source.zip --only-show-errors 2>/dev/null; then
                    echo "source: s3://$SOURCE_BUCKET/${PREFIX}agentexpress-source.zip"
                    mkdir -p /tmp/agentexpress && unzip -q /tmp/source.zip -d /tmp/agentexpress
                  else
                    echo "source: $REPO_URL ($REPO_BRANCH)"
                    git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" /tmp/agentexpress
                  fi
                  test -d /tmp/agentexpress/orchestrator/cdk || { echo "orchestrator/cdk not found at the root of the source"; exit 1; }
                - cd /tmp/agentexpress/orchestrator/cdk && npm ci --no-audit --no-fund
                - |
                  # Invoke each Bedrock model the labs use once, so first-use access is in place
                  # before participants arrive. Non-fatal: a failure is reported, not raised.
                  if [ "$ACTION" = "deploy" ]; then
                    for M in $CLAUDE_MODELS; do
                      aws bedrock-runtime converse --model-id "$M" --messages '[{"role":"user","content":[{"text":"hello"}]}]' \
                        --inference-config '{"maxTokens":5}' >/dev/null && echo "model OK: $M" || echo "WARNING: cannot invoke $M"
                    done
                    aws bedrock-runtime invoke-model --model-id amazon.titan-embed-text-v2:0 --body '{"inputText":"hello"}' \
                      --cli-binary-format raw-in-base64-out /tmp/embed.json >/dev/null && echo "model OK: titan-embed-v2" || echo "WARNING: cannot invoke Titan Text Embeddings V2"
                    aws bedrock-runtime invoke-model --region us-west-2 --model-id stability.sd3-5-large-v1:0 \
                      --body '{"prompt":"a bright cafe interior","output_format":"png"}' \
                      --cli-binary-format raw-in-base64-out /tmp/image.json >/dev/null && echo "model OK: sd3.5-large (us-west-2)" || echo "WARNING: cannot invoke Stable Diffusion 3.5 Large in us-west-2"
                  fi
                - |
                  set -euo pipefail
                  cd /tmp/agentexpress/orchestrator/cdk
                  FLAGS="-c agentName=$AGENT_NAME -c idp=cognito -c createCognito=true -c enableGateway=true -c consoleMode=builder"
                  if [ "${DESIGNER_MODEL:-none}" != "none" ]; then FLAGS="$FLAGS -c designerModel=$DESIGNER_MODEL"; fi
                  if [ "$ACTION" = "destroy" ]; then
                    npx cdk destroy --force $FLAGS
                    aws ssm delete-parameters --names /agentexpress/workshop/uiUrl /agentexpress/workshop/userPoolId /agentexpress/workshop/password || true
                  else
                    npx cdk bootstrap $FLAGS   # bootstrap synthesizes the app too, so it needs the same flags
                    npx cdk deploy $FLAGS --require-approval never --outputs-file /tmp/outputs.json
                    python3 - <<'PY'
                  # Create the two workshop users (Alice and Bob) in the members group with one
                  # generated password, and publish the console URL, pool id and password to SSM.
                  import json, secrets, subprocess

                  def aws(*args, check=True):
                      return subprocess.run(["aws", *args], check=check, capture_output=True, text=True)

                  outs = next(iter(json.load(open("/tmp/outputs.json")).values()))
                  pool = outs["cognitoUserPoolId"]
                  # Reuse the password from an earlier deploy, so a redeploy never invalidates the
                  # WorkshopPassword stack output. Generate one only on the first deploy.
                  prev = aws("ssm", "get-parameter", "--name", "/agentexpress/workshop/password",
                             "--query", "Parameter.Value", "--output", "text", check=False)
                  password = prev.stdout.strip() if prev.returncode == 0 and prev.stdout.strip() \
                      else "Ax" + secrets.token_hex(6) + "7"  # upper, lower and digit; 15 characters
                  for user in ("alice@example.com", "bob@example.com"):
                      exists = aws("cognito-idp", "admin-get-user", "--user-pool-id", pool, "--username", user, check=False)
                      if exists.returncode != 0:
                          aws("cognito-idp", "admin-create-user", "--user-pool-id", pool, "--username", user,
                              "--user-attributes", f"Name=email,Value={user}", "Name=email_verified,Value=true",
                              "--message-action", "SUPPRESS")
                      aws("cognito-idp", "admin-set-user-password", "--user-pool-id", pool, "--username", user,
                          "--password", password, "--permanent")
                      aws("cognito-idp", "admin-add-user-to-group", "--user-pool-id", pool, "--username", user,
                          "--group-name", "members")
                      print("workshop user ready:", user)
                  for name, value in (("uiUrl", outs["uiUrl"]), ("userPoolId", pool), ("password", password)):
                      aws("ssm", "put-parameter", "--overwrite", "--type", "String",
                          "--name", f"/agentexpress/workshop/{name}", "--value", value)
                  print("Console URL:", outs["uiUrl"])
                  PY
                  fi
            post_build:
              commands:
                - |
                  # Signal the CloudFormation wait condition (first deploy only; later signals are ignored).
                  if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then STATUS=SUCCESS; else STATUS=FAILURE; fi
                  curl -s -X PUT -H 'Content-Type:' \
                    --data-binary "{\"Status\":\"$STATUS\",\"Reason\":\"cdk $ACTION finished\",\"UniqueId\":\"console\",\"Data\":\"$STATUS\"}" \
                    "$WAIT_URL" || true

  # ---------------------------------------------------------------------------
  # A small custom resource: on Create it starts the deploy build, and (as
  # ReadOutputs) it reads the URL and pool id the build wrote to SSM.
  # ---------------------------------------------------------------------------
  HelperRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: helper
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt DeployProject.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agentexpress/workshop/*"

  HelperFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt HelperRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request
          import boto3

          class cfnresponse:  # minimal stand-in for the cfn-response module (not always injected)
              SUCCESS, FAILED = "SUCCESS", "FAILED"

              @staticmethod
              def send(event, context, status, data, physical_id=None, reason=None):
                  body = json.dumps({
                      "Status": status,
                      "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                      "PhysicalResourceId": physical_id or context.log_stream_name,
                      "StackId": event["StackId"], "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"], "Data": data,
                  }).encode()
                  req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT",
                                               headers={"Content-Type": "", "Content-Length": str(len(body))})
                  urllib.request.urlopen(req, timeout=30)

          def handler(event, context):
              props = event.get("ResourceProperties", {})
              data = {}
              try:
                  if event["RequestType"] == "Create" and props.get("Action") == "StartBuild":
                      build = boto3.client("codebuild").start_build(projectName=props["Project"])
                      data["BuildId"] = build["build"]["id"]
                  elif event["RequestType"] != "Delete" and props.get("Action") == "ReadOutputs":
                      ssm = boto3.client("ssm")
                      for name in ("uiUrl", "userPoolId", "password"):
                          data[name] = ssm.get_parameter(Name=f"/agentexpress/workshop/{name}")["Parameter"]["Value"]
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data, props.get("Action", "helper"))
              except Exception as exc:  # report the reason to CloudFormation instead of hanging
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(exc))

  StartDeploy:
    Type: Custom::StartBuild
    Properties:
      ServiceToken: !GetAtt HelperFunction.Arn
      ServiceTimeout: 300 # fail in 5 minutes, not 1 hour, if the helper never answers
      Action: StartBuild
      Project: !Ref DeployProject

  ConsoleReady:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: StartDeploy
    Properties:
      Handle: !Ref ConsoleWaitHandle
      Timeout: "5400"
      Count: 1

  ConsoleOutputs:
    Type: Custom::ReadOutputs
    DependsOn: ConsoleReady
    Properties:
      ServiceToken: !GetAtt HelperFunction.Arn
      ServiceTimeout: 300
      Action: ReadOutputs

Outputs:
  ConsoleUrl:
    Description: The AgentExpress console (CloudFront). Open it in your browser.
    Value: !GetAtt ConsoleOutputs.uiUrl
  UserAlice:
    Description: First workshop user (builds and deploys the workflows).
    Value: alice@example.com
  UserBob:
    Description: Second workshop user (a colleague the build is shared with).
    Value: bob@example.com
  WorkshopPassword:
    Description: Generated sign-in password for both workshop users. Workshop use only.
    Value: !GetAtt ConsoleOutputs.password
  UserPoolId:
    Description: Cognito user pool of the console.
    Value: !GetAtt ConsoleOutputs.userPoolId
  DeployProject:
    Description: CodeBuild project that deploys or destroys the console.
    Value: !Ref DeployProject
  ConsoleStack:
    Description: The CloudFormation stack the CDK app creates.
    Value: !Join ["-", !Split ["_", !Sub "${AgentName}-stack"]]
